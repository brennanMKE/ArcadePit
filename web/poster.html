<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcade Conversation Pit Print</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Print layout: 18 x 12 in landscape (1800 x 1200 CSS px, rendered at 2x = 3600 x 2400).
   Render fills the sheet; title + specs + plan sit in a band along the bottom. */
:root {
  --bg: #0b0a09;
  --fg: #efe8dc;
  --muted: #a39887;
  --line: #3a342c;
  --birch: #d9bd91;
  --led: #ffb547;
  --display: "Chakra Petch", "Avenir Next Condensed", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
html, body { margin: 0; width: 1800px; height: 1200px; overflow: hidden; background: var(--bg); color: var(--fg); }
#stage { position: absolute; inset: 0 0 340px 0; }
#stage canvas { display: block; width: 100%; height: 100%; }
.fade { position: absolute; left: 0; right: 0; bottom: 340px; height: 120px; background: linear-gradient(to bottom, transparent, var(--bg)); pointer-events: none; }
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 400px; box-sizing: border-box; padding: 0 70px 60px; display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 60px; align-items: end; }
.eyebrow { font: 600 15px var(--display); letter-spacing: .32em; text-transform: uppercase; color: var(--led); margin: 0 0 10px; }
h1 { font: 700 82px/0.95 var(--display); white-space: nowrap; margin: 0; letter-spacing: -0.005em; }
h1 span { color: var(--led); }
.lede { font: 400 20px/1.45 var(--body); color: var(--muted); margin: 14px 0 0; max-width: 64ch; }
.specs { display: flex; gap: 44px; margin: 20px 0 0; padding: 16px 0 0; border-top: 1px solid var(--line); }
.specs div { display: grid; gap: 4px; }
.specs dt { font: 600 12.5px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 0; font: 500 22px var(--mono); }
.plan { width: 420px; }
.plan .cap { font: 600 12.5px var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; display: flex; justify-content: space-between; }
.corner { position: absolute; top: 46px; right: 70px; font: 500 14px var(--mono); color: var(--muted); text-align: right; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="fade"></div>
<div class="corner" id="corner"></div>
<div class="band">
  <div>
    <p class="eyebrow">Noisebridge · Lounge Arcade</p>
    <h1>Arcade <span>Conversation Pit</span></h1>
    <p class="lede">Ten identical lit display benches ring the coffee-table arcade. Every seat lifts on a hidden piano hinge to store the collection, and every outer face glows with it.</p>
    <dl class="specs" id="specs"></dl>
  </div>
  <div class="plan">
    <p class="cap"><span>Plan</span><span id="scale"></span></p>
    <svg id="plan" viewBox="0 0 470 330" width="420" height="295" aria-label="Plan view of the pit"></svg>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import { loadData, makeMaterials, buildBench, buildBase, buildTable, ringPlacements, createStage, registerGlow, lidAnimator, setLids, fmt } from './viewer.js';

const data = await loadData();
const P = data.params;
const ft = (mm) => fmt.ftin(mm).replace(' ', '');

// ---------------------------------------------------------------- specs
const spec = (k, v) => `<div><dt>${k}</dt><dd>${v}</dd></div>`;
document.getElementById('specs').innerHTML = [
  spec('Footprint', `${ft(P.OUTER_L_TOP)} × ${ft(P.OUTER_W)}`),
  spec('Benches', `10 × ${ft(P.L)}`),
  spec('Seat height', ft(P.H)),
  spec('Walk-in gaps', `2 × ${ft(P.GAP)}`),
  spec('Storage', `${(data.variants.bench.spec.storage_l * 10).toLocaleString('en-US')} L`),
].join('');
document.getElementById('corner').innerHTML = `Bench ${Math.round(P.L)} × ${Math.round(P.D + P.OVERHANG)} × ${Math.round(P.H)} mm<br>Table ${Math.round(P.table[0])} × ${Math.round(P.table[1])} mm`;

// ---------------------------------------------------------------- plan (from the CAD placements)
const svg = document.getElementById('plan');
const W = 470, Hh = 330, pad = 26;
const s = Math.min((W - 2 * pad) / P.OUTER_L_TOP, (Hh - 2 * pad) / P.OUTER_W);
document.getElementById('scale').textContent = `${ft(P.OUTER_L_TOP)} × ${ft(P.OUTER_W)}`;
const X = (x) => W / 2 + x * s, Y = (y) => Hh / 2 - y * s;
let out = '';
for (const pl of data.placements) {
  const r = pl.rot * Math.PI / 180, c = Math.cos(r), si = Math.sin(r);
  const pts = [[0, -P.OVERHANG], [P.L, -P.OVERHANG], [P.L, P.D], [0, P.D]].map(([x, y]) =>
    [pl.pos[0] + x * c - y * si, pl.pos[1] + x * si + y * c]);
  out += `<polygon points="${pts.map(([x, y]) => `${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(' ')}" fill="#2a241c" stroke="#d9bd91" stroke-width="1.6"/>`;
  // glowing display face (local y = 0 edge)
  out += `<line x1="${X(pts[0][0]).toFixed(1)}" y1="${Y(pts[0][1]).toFixed(1)}" x2="${X(pts[1][0]).toFixed(1)}" y2="${Y(pts[1][1]).toFixed(1)}" stroke="#ffb547" stroke-width="3"/>`;
}
const [tl, tw] = P.table;
out += `<rect x="${X(-tl / 2)}" y="${Y(tw / 2)}" width="${tl * s}" height="${tw * s}" fill="#141414" stroke="#efe8dc" stroke-width="1.4"/>`;
out += `<rect x="${X(-473)}" y="${Y(267)}" width="${946 * s}" height="${533 * s}" fill="#5b2a8a" opacity=".85"/>`;
for (const sy of [1, -1]) {
  const y = Y(sy * (P.INNER_W / 2 + P.D / 2));
  out += `<text x="${W / 2}" y="${y + 4}" fill="#a39887" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle">${ft(P.GAP)} gap</text>`;
}
svg.innerHTML = out;

// ---------------------------------------------------------------- render
const stage = createStage(document.getElementById('stage'), { floorSize: 16 });
stage.renderer.setPixelRatio(window.devicePixelRatio);
stage.key.shadow.mapSize.set(4096, 4096);
stage.key.shadow.camera.left = stage.key.shadow.camera.bottom = -3.4;
stage.key.shadow.camera.right = stage.key.shadow.camera.top = 3.4;
stage.camera.fov = 30;
stage.controls.enableDamping = false;

const mats = makeMaterials();
const benches = [];
for (const pl of ringPlacements(data)) {
  const b = buildBench(data, pl.variant, mats, { contents: pl.contents, base: pl.base });
  b.position.set(pl.pos[0], pl.pos[1], 0);
  b.rotation.z = pl.rot;
  stage.root.add(b);
  registerGlow(stage, b.userData.glow, 0.12, 0.65);
  benches.push(b);
}
stage.root.add(buildBase(data, 'ring_hw', mats));   // conduit couplings, corner spacers, bolts
const table = buildTable(data, mats);
stage.root.add(table);
registerGlow(stage, table.userData.glow, 0.0, 1.1);
stage.onFrame.push(lidAnimator(benches));

// a couple of lids up so the storage and hinge read
const pick = (side, i) => data.placements.map((p, k) => [p, k]).filter(([p]) => p.side === side)[i][1];
setLids(benches[pick('north', 0)], 98);
setLids(benches[pick('west', 1)], 98);

stage.setNight(true);
stage.renderer.toneMappingExposure = 1.12;
stage.bloom.strength = 0.42;
stage.camera.position.set(3.55, 2.0, 4.15);
stage.controls.target.set(0.0, 0.12, -0.1);
stage.camera.updateProjectionMatrix();
stage.controls.update();
setTimeout(() => document.body.dataset.ready = '1', 2500);
</script>
</body>
</html>
